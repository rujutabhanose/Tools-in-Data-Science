name: Daily Commit Workflow

on:
  schedule:
    - cron: '13 32 * * *'  # Runs daily at 06:17 UTC (Adjust time as needed)

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Update file with timestamp - 23f3003411@ds.study.iitm.ac.in
        run: |
          echo "Updated on $(date -u)" >> update_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update_log.txt
          git commit -m "Daily update: $(date -u)"
          git push
